<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sunny's memories</title>
  <link rel="stylesheet" href="style.css?v=16">
  <link rel="icon" href="data:,">
  <meta name="google-site-verification" content="MkeefcRBU_Tw7sqT4G-G0O-QwxG1KsKYbzltt_3SdCA" />
  <meta name="description" content="Sunny’s memories in Shadow Slave by chapter">
</head>
<body>


  <div class="controls">


    <div class="searchControls" role="search" aria-label="Find memories">
      <label class="search-label" for="searchInput">Find a memory</label>
      <div class="searchRow">
        <div class="search-wrap">
          <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 4.5 4.5"/></svg>
          <input id="searchInput" type="search" placeholder="Search memories…" autocomplete="off" aria-describedby="searchError" />
          <button id="clearSearch" class="clear-search" type="button" aria-label="Clear search" hidden>×</button>
        </div>
        <div class="dropdown">
          <button class="dropdown-btn" id="searchOptionsBtn" type="button" onclick="toggleDropdown(event)" aria-expanded="false" aria-controls="menu">
            Search in <span id="searchFieldCount" class="field-count">1</span>
          </button>
          <div class="dropdown-menu" id="menu">
            <label for="search-name"><input id="search-name" checked type="checkbox" value="name"> Name</label>
            <label for="search-rank"><input id="search-rank" type="checkbox" value="rank"> Rank</label>
            <label for="search-tier"><input id="search-tier" type="checkbox" value="tier"> Tier</label>
            <label for="search-description"><input id="search-description" type="checkbox" value="description"> Description</label>
            <label for="search-enchantment-name"><input id="search-enchantment-name" type="checkbox" value="enchantments-name"> Enchantment names</label>
            <label for="search-enchantment-description"><input id="search-enchantment-description" type="checkbox" value="enchantments-description"> Enchantment descriptions</label>
          </div>
        </div>
      </div>
      <div class="search-meta">
        <div class="sort-controls">
          <label for="sortSelect">Sort by</label>
          <select id="sortSelect">
            <option value="rank">Rank</option>
            <option value="tier">Tier</option>
            <option value="chapter-recv">Chapter received</option>
            <option value="chapter-changed">Chapter changed</option>
            <option value="name">Name</option>
          </select>
          <button id="sortBtn" type="button" aria-label="Descending order. Switch to ascending" title="Descending order. Switch to ascending">↓</button>
        </div>
      </div>
    </div>

    <div class="slider-wrap">
      <label id="chapterLabel" for="chapter">Chapter</label>
      <div class="controlsChapter">
        <input type="range" id="chapter" min="0" max="2300" value="0" step="1">
        <input type="number" id="chapter-input" min="0" max="2300" step="1" aria-label="Chapter number">
      </div>
    </div>
  </div>

  <p id="searchResults" class="search-results" role="status" aria-live="polite"></p>
  <p id="searchError" class="search-error" role="alert" hidden></p>
  <div id="searchEmpty" class="search-empty" hidden>
    <strong id="searchEmptyTitle">No matching memories</strong>
  </div>

  <div>
    <div>
      <label class="foldBtn">Currently Owned  —————————   <span class="arrow">▼</span></label>
      <div id="grid_owned" class="grid"></div>
    </div>
    <div>
        <label class="foldBtn">Destroyed  —————————   <span class="arrow">▼</span></label>
        <div id="grid_destroyed" class="grid"></div>
    </div>
    <div>
        <label class="foldBtn">Given Away  —————————   <span class="arrow">▼</span></label>
        <div id="grid_given_away" class="grid"></div>
    </div>
  </div>

  <button id="settingsBtn">⚙️</button>

  <div id="SettingsOverlay" class="SettingsOverlay">
    <div class="settingsPanel">
      <div class="sidebar">
        <button class="tab active" data-target="color">Color</button>
        <button class="tab" data-target="border">Border</button>
        <button class="tab" data-target="glint">glint</button>
        <button class="tab" data-target="general">general</button>
        <button class="tab" data-target="search">Search</button>
      </div>

      <div class="content">
        <span class="close" id="closeBtn">✖</span>

        <div id="section-color" class="section active">
          <!--<p style="font-size: 11px;color:#474545">work in progress</p>-->
          <h2>Color</h2>
          <label for="colorBy">color by</label>
          <select onchange="setColorBy('colorBy')" id="colorBy">
            <option value="rank" selected>rank</option>
            <option value="tier">tier</option>
          </select>

          <div id="colorBySection-rank" class="colorBySection active">
            <div class="field">
              <label for="colorPicker">Dormant: </label>
              <input onchange="ApplyBackgroundColors('rank-Dormant', this.value)" type="color" name="colorPicker" value="#7f8c8d">
            </div>
            <div class="field">
              <label for="colorPicker">Awakened: </label>
              <input onchange="ApplyBackgroundColors('rank-Awakened', this.value)" type="color" name="colorPicker" value="#27ae60">
            </div>
            <div class="field">
              <label for="colorPicker">Ascended: </label>
              <input onchange="ApplyBackgroundColors('rank-Ascended', this.value)" type="color" name="colorPicker" value="#2980b9">
            </div>
            <div class="field">
              <label for="colorPicker">Transcendent: </label>
              <input onchange="ApplyBackgroundColors('rank-Transcendent', this.value)" type="color" name="colorPicker" value="#8e44ad">
            </div>
            <div class="field">
              <label for="colorPicker">Supreme: </label>
              <input onchange="ApplyBackgroundColors('rank-Supreme', this.value)" type="color" name="colorPicker" value="#ff01c8">
            </div>
            <div class="field">
              <label for="colorPicker">Sacred: </label>
              <input onchange="ApplyBackgroundColors('rank-Sacred', this.value)" type="color" name="colorPicker" value="#0400f3">
            </div>
            <div class="field">
              <label for="colorPicker">Divine: </label>
              <input onchange="ApplyBackgroundColors('rank-Divine', this.value)" type="color" name="colorPicker" value="#f39c12">
            </div>
            <div class="field">
              <label for="colorPicker">?: </label>
              <input onchange="ApplyBackgroundColors('rank-?', this.value)" type="color" name="colorPicker" value="#141414">
            </div>
            <button style="margin-top: 5%;" onclick="resetColors('rank')">Reset rank to default</button>
            <button onclick="UpdateColors('tier')">Use colors from tier</button>
          </div>
          <div id="colorBySection-tier" class="colorBySection">
            <div class="field">
              <label for="colorPicker">I: </label>
              <input onchange="ApplyBackgroundColors('tier-I', this.value)" type="color" name="colorPicker" value="#7f8c8d">
            </div>
            <div class="field">
              <label for="colorPicker">II: </label>
              <input onchange="ApplyBackgroundColors('tier-II', this.value)" type="color" name="colorPicker" value="#27ae60">
            </div>
            <div class="field">
              <label for="colorPicker">III: </label>
              <input onchange="ApplyBackgroundColors('tier-III', this.value)" type="color" name="colorPicker" value="#2980b9">
            </div>
            <div class="field">
              <label for="colorPicker">IV: </label>
              <input onchange="ApplyBackgroundColors('tier-IV', this.value)" type="color" name="colorPicker" value="#8e44ad">
            </div>
            <div class="field">
              <label for="colorPicker">V: </label>
              <input onchange="ApplyBackgroundColors('tier-V', this.value)" type="color" name="colorPicker" value="#ff01c8">
            </div>
            <div class="field">
              <label for="colorPicker">VI: </label>
              <input onchange="ApplyBackgroundColors('tier-VI', this.value)" type="color" name="colorPicker" value="#0400f3">
            </div>
            <div class="field">
              <label for="colorPicker">VII: </label>
              <input onchange="ApplyBackgroundColors('tier-VII', this.value)" type="color" name="colorPicker" value="#f39c12">
            </div>
            <div class="field">
              <label for="colorPicker">?: </label>
              <input onchange="ApplyBackgroundColors('tier-?', this.value)" type="color" name="colorPicker" value="#141414">
            </div>
            <button style="margin-top: 5%;" onclick="resetColors('tier')">Reset tier to default</button>
            <button onclick="UpdateColors('rank')">Use colors from rank</button>
          </div>
        </div>

        <div id="section-border" class="section">
          <h2>Border</h2>
          <label for="borderBy">Border by</label>
          <select id="borderBy">
            <option value="rank">Rank</option>
            <option value="tier">Tier</option>
          </select>
          <div id="borderOptions"></div>
          <div class="border-actions">
            <button id="resetBorders" type="button">Reset rank to default</button>
            <button id="copyBorders" type="button">Use borders from tier</button>
          </div>
        </div>

        <div id="section-glint" class="section">
          <!--<p style="font-size: 11px;color:#474545">work in progress (doesn't work yet)</p>-->
          <h2>Glint</h2>         
          <p style="padding: 5px;">Apply Glint for:</p>
          <div class="glintBySection">
            <label><input class="glintCheckBox" onchange="toggleGlint('Divine')" type="checkbox" value="Divine"> Divine</label>
            <label><input class="glintCheckBox" onchange="toggleGlint('Sacred')" type="checkbox" value="Sacred"> Sacred</label>
            <label><input class="glintCheckBox" onchange="toggleGlint('Supreme')" type="checkbox" value="Supreme"> Supreme</label>
            <label><input class="glintCheckBox" onchange="toggleGlint('Transcendent')" type="checkbox" value="Transcendent"> Transcendent</label>
            <label><input class="glintCheckBox" onchange="toggleGlint('Ascended')" type="checkbox" value="Ascended"> Ascended</label>
            <label><input class="glintCheckBox" onchange="toggleGlint('Awakened')" type="checkbox" value="Awakened"> Awakened</label>
            <label><input class="glintCheckBox" onchange="toggleGlint('Dormant')" type="checkbox" value="Dormant"> Dormant</label>

            <label><input class="glintCheckBox" onchange="toggleGlint('VII')" type="checkbox" value="VII"> VII</label>
            <label><input class="glintCheckBox" onchange="toggleGlint('VI')" type="checkbox" value="VI"> VI</label>
            <label><input class="glintCheckBox" onchange="toggleGlint('V')" type="checkbox" value="V"> V</label>
            <label><input class="glintCheckBox" onchange="toggleGlint('IV')" type="checkbox" value="IV"> IV</label>
            <label><input class="glintCheckBox" onchange="toggleGlint('III')" type="checkbox" value="III"> III</label>
            <label><input class="glintCheckBox" onchange="toggleGlint('II')" type="checkbox" value="II"> II</label>
            <label><input class="glintCheckBox" onchange="toggleGlint('I')" type="checkbox" value="I"> I</label>
          </div>
        </div>

        <div id="section-search" class="section">
          <h2>Search</h2>
          <label class="search-case-option" for="searchCaseSensitive">
            <input id="searchCaseSensitive" type="checkbox"> Case sensitive
          </label>
          <div class="search-modifier-row">
            <label class="search-case-option" for="searchWildcard">
              <input id="searchWildcard" type="checkbox" aria-describedby="searchWildcardDescription"> Wildcard
            </label>
            <span id="searchWildcardDescription">Use * for any text and ? for one character.</span>
          </div>
          <div class="search-modifier-row">
            <label class="search-case-option" for="searchFuzzy">
              <input id="searchFuzzy" type="checkbox" aria-describedby="searchFuzzyDescription"> Fuzzy
            </label>
            <span id="searchFuzzyDescription">Allow one character typo.</span>
          </div>
          <label class="search-mode-label" for="searchMatchMode">Matching mode</label>
          <select id="searchMatchMode">
            <option value="contains">Contains</option>
            <option value="equals">Equals</option>
            <option value="startsWith">Starts with</option>
            <option value="endsWith">Ends with</option>
            <option value="notContains">Does not contain</option>
            <option value="regex">Regular expression (regex)</option>
          </select>
        </div>

        <div id="section-general" class="section">
          <!--<p style="font-size: 11px;color:#474545">work in progress (doesn't work yet)</p>-->
          <h2>General</h2>
          <div class="generalSection">
            <label><input type="checkbox" id="historyToggle" checked> Show memory history</label>
            <label><input type="checkbox" id="groupGivenAwayToggle"> Show given away memories under Destroyed</label>
          </div>
        </div>

      </div>
    </div>
  </div>

  <div id="infoPanel"></div>
  <p id="dataStatus" role="status"></p>

  <script src="script.js?v=17"></script>
</body>
</html>
